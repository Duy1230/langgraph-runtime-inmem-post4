services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: langgraph
      POSTGRES_PASSWORD: langgraph
      POSTGRES_USER: langgraph
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph -d langgraph"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - langgraph-postgres:/var/lib/postgresql/data

volumes:
  langgraph-postgres:
