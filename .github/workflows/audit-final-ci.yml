name: Final audit validation

on:
  push:
    branches:
      - fix/audit-reported-bugs-20260921

jobs:
  final:
    strategy:
      fail-fast: false
      matrix:
        langgraph_api: ["0.13.2", "0.13.3"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: langgraph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d langgraph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/langgraph_test
      TEST_POSTGRES_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/langgraph_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[postgres]' \
            'langgraph==1.2.11' \
            'langgraph-api==${{ matrix.langgraph_api }}' \
            'langgraph-cli[inmem]==0.4.31' \
            'langgraph-checkpoint==4.2.0' \
            pytest pytest-asyncio build ruff
      - name: Source tests
        run: pytest -q -W error
      - name: Static checks
        run: |
          python -m compileall -q src
          git diff --check
          ruff check --select E9,F63,F7,F82 src tests
      - name: Build and verify wheel
        run: |
          python -m build --wheel
          python -m pip uninstall -y langgraph-runtime-inmem
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python - <<'PY'
          import langgraph_runtime_inmem as runtime
          print("version=", runtime.__version__)
          print("loaded_from=", runtime.__file__)
          assert runtime.__version__ == "0.33.3.post4+review.20260921"
          assert "site-packages" in runtime.__file__
          PY
          cat >/tmp/pytest.ini <<'EOF'
          [pytest]
          asyncio_mode = auto
          markers =
              integration: exercises connected components; some tests require external infrastructure such as PostgreSQL
          EOF
          pytest -q -W error -c /tmp/pytest.ini "$GITHUB_WORKSPACE/tests"
