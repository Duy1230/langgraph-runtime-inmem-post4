name: Audit bugfix CI

on:
  push:
    branches:
      - fix/audit-reported-bugs-20260921

permissions:
  contents: write

jobs:
  test-and-commit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: langgraph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d langgraph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/langgraph_test
      TEST_POSTGRES_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/langgraph_test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply staged source fixes
        id: apply
        shell: bash
        run: |
          if [[ -f .audit_apply_fixes.py ]]; then
            python .audit_apply_fixes.py
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact review stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[postgres]' \
            'langgraph==1.2.11' \
            'langgraph-api==0.13.3' \
            'langgraph-cli[inmem]==0.4.31' \
            'langgraph-checkpoint==4.2.0' \
            pytest pytest-asyncio ruff

      - name: Full test suite
        run: pytest -q -W error

      - name: Compile source
        run: python -m compileall -q src

      - name: Diff hygiene
        run: git diff --check

      - name: Lint changed implementation and regression tests
        run: |
          ruff check \
            src/langgraph_runtime_inmem/_persistence.py \
            src/langgraph_runtime_inmem/inmem_stream.py \
            src/langgraph_runtime_inmem/ops.py \
            src/langgraph_runtime_inmem/checkpoint.py \
            src/langgraph_runtime_inmem/thread_ttl.py \
            tests/test_persistence.py \
            tests/test_inmem_stream.py \
            tests/test_thread_ttl.py \
            tests/test_thread_ttl_loop.py

      - name: Commit validated fixes
        if: steps.apply.outputs.applied == 'true'
        run: |
          rm .audit_apply_fixes.py
          git config user.name "Duy1230"
          git config user.email "Duy1230@users.noreply.github.com"
          git add -A
          git commit -m "fix: address audit-reported runtime bugs [skip ci]"
          git push origin HEAD:fix/audit-reported-bugs-20260921
