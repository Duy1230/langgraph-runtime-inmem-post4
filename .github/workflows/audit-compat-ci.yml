name: Audit compatibility CI

on:
  push:
    branches:
      - fix/audit-reported-bugs-20260921

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        langgraph_api: ["0.13.2", "0.13.3"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: langgraph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d langgraph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/langgraph_test
      TEST_POSTGRES_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/langgraph_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[postgres]' \
            'langgraph==1.2.11' \
            'langgraph-api==${{ matrix.langgraph_api }}' \
            'langgraph-cli[inmem]==0.4.31' \
            'langgraph-checkpoint==4.2.0' \
            pytest pytest-asyncio build

      - name: Source suite
        run: pytest -q -W error

      - name: Build wheel
        run: python -m build --wheel

      - name: Install built wheel
        run: |
          python -m pip uninstall -y langgraph-runtime-inmem
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python - <<'PY'
          import langgraph_runtime_inmem as runtime
          print("version=", runtime.__version__)
          print("loaded_from=", runtime.__file__)
          assert "site-packages" in runtime.__file__
          PY

      - name: Wheel-isolated full suite
        shell: bash
        run: |
          cat >/tmp/pytest.ini <<'EOF'
          [pytest]
          asyncio_mode = auto
          markers =
              integration: exercises connected components; some tests require external infrastructure such as PostgreSQL
          EOF
          cd /tmp
          pytest -q -W error -c /tmp/pytest.ini "$GITHUB_WORKSPACE/tests"
