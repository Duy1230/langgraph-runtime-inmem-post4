[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-runtime-inmem"
version = "0.33.3.post4+review.20260921"
description = "In-memory implementation for the LangGraph API server, patched with TTL, persistence, and lifecycle fixes."
readme = "README.md"
requires-python = ">=3.11"
license = "Elastic-2.0"
authors = [{ name = "LangChain" }]
dependencies = [
  "blockbuster>=1.5.24,<2.0.0",
  "croniter>=1.0.1",
  "langgraph-checkpoint>=3,<5",
  "langgraph>=0.4.10,<2",
  "sse-starlette>=2",
  "starlette>=1.3.1",
  "structlog>23",
]

[project.optional-dependencies]
postgres = [
  "langgraph-checkpoint-postgres",
  "psycopg[binary,pool]>=3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "integration: exercises connected components; some tests require external infrastructure such as PostgreSQL",
]
testpaths = ["tests"]
pythonpath = ["src"]
